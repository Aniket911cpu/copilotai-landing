<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Glow -->
  <circle cx="50" cy="50" r="45" stroke="url(#primaryGradient)" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="50" cy="50" r="38" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Inner Core Hexagon -->
  <path d="M50 20 L76 35 L76 65 L50 80 L24 65 L24 35 Z" fill="url(#glow)" stroke="url(#primaryGradient)" stroke-width="3" filter="url(#neonGlow)" />
  
  <!-- Central Tech Eye / Node -->
  <circle cx="50" cy="50" r="12" fill="url(#primaryGradient)" />
  <circle cx="50" cy="50" r="6" fill="#0A0A0F" />
  
  <!-- Connecting Lines -->
  <line x1="50" y1="20" x2="50" y2="38" stroke="url(#primaryGradient)" stroke-width="2" />
  <line x1="50" y1="62" x2="50" y2="80" stroke="url(#primaryGradient)" stroke-width="2" />
  <line x1="24" y1="35" x2="40" y2="44" stroke="url(#primaryGradient)" stroke-width="2" />
  <line x1="76" y1="65" x2="60" y2="56" stroke="url(#primaryGradient)" stroke-width="2" />
  <line x1="24" y1="65" x2="40" y2="56" stroke="url(#primaryGradient)" stroke-width="2" />
  <line x1="76" y1="35" x2="60" y2="44" stroke="url(#primaryGradient)" stroke-width="2" />

</svg>
